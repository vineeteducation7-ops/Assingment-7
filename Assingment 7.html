<!DOCTYPE html>
<html>
<head>
<title>Responsive Website</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    margin:0;
    font-family:Arial;
    background-color:#f4f4f4;
}

.header{
    background-color:blue;
    color:white;
    text-align:center;
    padding:20px;
}

.gallery{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
    padding:20px;
}

.gallery img{
    width:100%;
    height:200px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
    padding:20px;
}

.box{
    background:white;
    border:1px solid black;
    padding:10px;
    text-align:center;
}

.box img{
    width:100%;
}

button{
    padding:10px;
    background-color:green;
    color:white;
    border:none;
}

.dashboard{
    display:grid;

    grid-template-areas:
    "head head"
    "side main"
    "foot foot";

    grid-template-columns:1fr 3fr;

    gap:10px;
    padding:20px;
}

.head{
    grid-area:head;
    background-color:orange;
    padding:20px;
}

.side{
    grid-area:side;
    background-color:gray;
    padding:20px;
    color:white;
}

.main{
    grid-area:main;
    background-color:white;
    padding:20px;
}

.foot{
    grid-area:foot;
    background-color:black;
    color:white;
    padding:20px;
    text-align:center;
}

/* Tablet */

@media(max-width:768px)
{
    .gallery{
        grid-template-columns:1fr 1fr;
    }

    .dashboard{
        grid-template-areas:
        "head"
        "side"
        "main"
        "foot";

        grid-template-columns:1fr;
    }
}

/* Mobile */

@media(max-width:480px)
{
    .gallery{
        grid-template-columns:1fr;
    }

    .products{
        grid-template-columns:1fr;
    }

    h1{
        font-size:24px;
    }

    button{
        width:100%;
    }
}

</style>
</head>

<body>

<div class="header">
<h1>Responsive Website</h1>
</div>

<h2 style="padding-left:20px;">Gallery</h2>

<div class="gallery">

<img src="https://via.placeholder.com/300">
<img src="https://via.placeholder.com/300">
<img src="https://via.placeholder.com/300">
<img src="https://via.placeholder.com/300">
<img src="https://via.placeholder.com/300">
<img src="https://via.placeholder.com/300">

</div>

<h2 style="padding-left:20px;">Products</h2>

<div class="products">

<div class="box">
<img src="https://via.placeholder.com/200">
<h3>Laptop</h3>
<p>₹45000</p>
<button>Buy</button>
</div>

<div class="box">
<img src="https://via.placeholder.com/200">
<h3>Phone</h3>
<p>₹18000</p>
<button>Buy</button>
</div>

<div class="box">
<img src="https://via.placeholder.com/200">
<h3>Mouse</h3>
<p>₹800</p>
<button>Buy</button>
</div>

<div class="box">
<img src="https://via.placeholder.com/200">
<h3>Keyboard</h3>
<p>₹1200</p>
<button>Buy</button>
</div>

</div>

<h2 style="padding-left:20px;">Dashboard</h2>

<div class="dashboard">

<div class="head">
Header
</div>

<div class="side">
Sidebar Menu
</div>

<div class="main">
Main Content Area
</div>

<div class="foot">
Footer
</div>

</div>

</body>
</html>
